    <!--Taildwin-->
    <main  class="flex justify-center items-center py-40 bg-[#f4f7f9]">
        <section class="basis-4/5 justify-center items-center border-3 border-[#005691] rounded-xl bg-white p-10">
            <div id="titulo-form" class="flex flex-col justify-self-center item-center pb-5">
                <h1 class="text-[#0772ba] text-center ">Suscríbete a nuestro Newsletter</h1>
                <h4 class="text-secondary text-center">Recibe las últimas noticias, ofertas exclusivas y consejos de cuidado de la piel directamente en tu bandeja de entrada.</h4>
            </div>
                
            <!--Bootstrap-->
            <!--cambiar a metodo post cuando haya envío real-->
            <form id="contacto" action="agradecimiento.html" class="g-3 needs-validation">
                <div class="row">
                    <div class="col-12 col-sm-6">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required >
                        </div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <div class="mb-3">
                            <label for="exampleFormControlInput1" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="main" placeholder="name@example.com" required >
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-lg-6">
                        <div class="mb-3">
                            <label for="tipoPiel" class="form-label">¿Cuál es tu tipo de piel?</label>
                            <select class="form-select" id="tipoPiel" required>
                                <option value="" selected>Selecciona tu tipo de piel</option>
                                <option value="seca">Piel seca</option>
                                <option value="mixta">Piel Mixta</option>
                                <option value="sensible">Piel Sensible</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-lg-6">
                        <div class="mb-3">
                            <label for="intereses" class="form-label">¿Qué tipo de contenido te gustaría recibir?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="novedades" id="novedades">
                                <label class="form-check-label" for="novedades">Novedades de productos</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="ofertas" id="ofertas">
                                <label class="form-check-label" for="ofertas">Ofertas exclusivas</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="consejos" id="consejos">
                                <label class="form-check-label" for="consejos">Consejos de cuidado de la piel</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3">
                        <label for="Textarea" class="form-label">Envíanos tu consulta o comentarios</label>
                        <textarea class="form-control" id="consulta" name="consulta" rows="3"></textarea>
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="invalidCheck" name="checkbox" required>
                            <label class="form-check-label" for="invalidCheck">
                                Acepto recibir comunicaciones de CeraVe y confirmo que he leído la <a href="#">Política de Privacidad</a>.
                            </label>
                        </div>
                    </div>
                </div>    

                <div class="row justify-content-end gap-3 pt-5">
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Suscribirse</button>
                    </div>

                    <div class="col-auto">
                        <button  type="reset" class="btn btn-secondary btn-reset">Limpiar</button>
                    </div>
                </div>

            </form>
        </section>
    </main>
